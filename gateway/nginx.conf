# Edge rate limit: 20 req/s per client IP, burst of 40
limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
limit_req_status 429;

# Docker DNS returns every replica IP -> nginx round-robins across them
upstream shorten_svc   { server shorten:3001; }
upstream redirect_svc  { least_conn; server redirect:3002; }
upstream analytics_svc { server analytics:3003; }

server {
  listen 80;
  limit_req zone=perip burst=40 nodelay;

  location /api/shorten   { proxy_pass http://shorten_svc;   include /etc/nginx/proxy_params; }
  location /api/urls/     { proxy_pass http://shorten_svc;   include /etc/nginx/proxy_params; }
  location /api/analytics/{ proxy_pass http://analytics_svc; include /etc/nginx/proxy_params; }
  location /              { proxy_pass http://redirect_svc;  include /etc/nginx/proxy_params; }
}
